# Builds the packaged section assembler and aligner for Windows (Python and all libraries inside; users need nothing installed) and
# attaches it to a GitHub release. To publish a new version:   git tag v1.2.0   and   git push origin v1.2.0
# It can also be run by hand (Actions > Release section assembler > Run workflow) to get the zip as a build artifact without a release.
name: Release section assembler

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install the libraries
        run: |
          python -m pip install --upgrade pip
          python -m pip install --only-binary :all: -r packaging/requirements-assembler.txt

      - name: Put the version in the program
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF -like "refs/tags/v*") { $env:GITHUB_REF_NAME.TrimStart("v") } else { "dev-$($env:GITHUB_SHA.Substring(0,7))" }
          Set-Content -Path FileConverters/app_version.py -Value "VERSION = `"$version`""
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build
        run: python -m PyInstaller packaging/assembler.spec --noconfirm --distpath packaging/dist --workpath packaging/build

      - name: Check that everything the program needs is inside the package
        shell: pwsh
        run: |
          Start-Process -FilePath packaging/dist/SectionAssembler/SectionAssembler.exe -ArgumentList "--selftest" -Wait
          Get-Content packaging/dist/SectionAssembler/selftest.txt
          if (-not (Select-String -Path packaging/dist/SectionAssembler/selftest.txt -Pattern "ALL FINE" -Quiet)) { throw "the package is missing something" }
          Remove-Item packaging/dist/SectionAssembler/selftest.txt

      - name: Zip, with a copy under a fixed name and a checksum file
        shell: pwsh
        run: |
          # The version is in the first name; the second never changes, so that .../releases/latest/download/SectionAssembler-windows.zip
          # is a link that always gives the newest version.
          Compress-Archive -Path packaging/dist/SectionAssembler -DestinationPath "SectionAssembler-$env:VERSION-windows.zip"
          Copy-Item "SectionAssembler-$env:VERSION-windows.zip" SectionAssembler-windows.zip
          Get-ChildItem SectionAssembler-*.zip | ForEach-Object { "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name } | Set-Content SHA256SUMS.txt
          Get-Content SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: SectionAssembler-windows
          path: |
            SectionAssembler-*.zip
            SHA256SUMS.txt

      - name: Attach it to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            SectionAssembler-*.zip
            SHA256SUMS.txt
          generate_release_notes: true
