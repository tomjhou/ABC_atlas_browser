# Builds the packaged ABC atlas browser for Windows (Python and all libraries inside; users need nothing installed) and attaches it to a GitHub
# release. To publish a new version:   git tag atlas-v1.0.0   and   git push origin atlas-v1.0.0
# (the section assembler has its own workflow and tags: v1.2.0). It can also be run by hand (Actions > Release ABC atlas browser > Run workflow)
# to get the zip as a build artifact without a release.
name: Release ABC atlas browser

on:
  push:
    tags: ["atlas-v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install the libraries
        run: |
          python -m pip install --upgrade pip
          python -m pip install --only-binary :all: -r packaging/requirements-atlas.txt

      - name: Put the version in the program
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF -like "refs/tags/atlas-v*") { $env:GITHUB_REF_NAME.Substring("atlas-v".Length) } else { "dev-$($env:GITHUB_SHA.Substring(0,7))" }
          Set-Content -Path atlas_version.py -Value "VERSION = `"$version`""
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build
        run: python -m PyInstaller packaging/atlas_browser.spec --noconfirm --distpath packaging/dist --workpath packaging/build

      - name: Check that everything the program needs is inside the package
        shell: pwsh
        run: |
          Start-Process -FilePath packaging/dist/ABCAtlasBrowser/ABCAtlasBrowser.exe -ArgumentList "--selftest" -Wait
          Get-Content packaging/dist/ABCAtlasBrowser/selftest.txt
          if (-not (Select-String -Path packaging/dist/ABCAtlasBrowser/selftest.txt -Pattern "ALL FINE" -Quiet)) { throw "the package is missing something" }
          Remove-Item packaging/dist/ABCAtlasBrowser/selftest.txt

      - name: Zip, with a checksum file
        shell: pwsh
        run: |
          Compress-Archive -Path packaging/dist/ABCAtlasBrowser -DestinationPath "ABCAtlasBrowser-$env:VERSION-windows.zip"
          Get-ChildItem ABCAtlasBrowser-*.zip | ForEach-Object { "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name } | Set-Content SHA256SUMS-atlas.txt
          Get-Content SHA256SUMS-atlas.txt

      - uses: actions/upload-artifact@v4
        with:
          name: ABCAtlasBrowser-windows
          path: |
            ABCAtlasBrowser-*.zip
            SHA256SUMS-atlas.txt

      - name: Attach it to the release
        if: startsWith(github.ref, 'refs/tags/atlas-v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ABCAtlasBrowser-*.zip
            SHA256SUMS-atlas.txt
          generate_release_notes: true
